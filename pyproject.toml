# Track B packaging (docs/distribution_plan.md). Track A never needs this file:
# the checkout still runs as `python -m harness` / `python scripts/x.py`.
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "manuwright"
dynamic = ["version"]
description = "Verification engine for AI-assisted medical manuscript writing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1.0", "requests>=2.31.0", "pypdf>=4.0"]

[project.scripts]
manuwright = "manuwright.cli:main"

[tool.hatch.version]
path = "harness/__init__.py"

# Allowlist only: code plus the public runtime assets commands rely on.
# Never PDFs, profile/, Style anchors, drafts, data, results or review records.
[tool.hatch.build.targets.wheel]
packages = ["manuwright"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"harness" = "manuwright/harness"
"scripts" = "manuwright/scripts"
"Style/terminology.md" = "manuwright/Style/terminology.md"
"Style/style_guide.md" = "manuwright/Style/style_guide.md"
"profile/example_authors.md" = "manuwright/profile/example_authors.md"
"WORKFLOW.md" = "manuwright/WORKFLOW.md"
"docs" = "manuwright/docs"
"review/gates/_TEMPLATE.GATE.md" = "manuwright/review/gates/_TEMPLATE.GATE.md"
# Agent adapters: the installed engine folder doubles as the plugin/marketplace root.
"skills" = "manuwright/skills"
"hooks" = "manuwright/hooks"
".claude-plugin" = "manuwright/.claude-plugin"
".codex-plugin" = "manuwright/.codex-plugin"
".agents/plugins" = "manuwright/.agents/plugins"
"gemini-extension.json" = "manuwright/gemini-extension.json"
"plugin.json" = "manuwright/plugin.json"

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "README.md", "manuwright", "harness", "scripts",
                "Style/terminology.md", "Style/style_guide.md", "profile/example_authors.md", "WORKFLOW.md", "docs", "review/gates/_TEMPLATE.GATE.md",
                "skills", "hooks", ".claude-plugin", ".codex-plugin", ".agents/plugins", "gemini-extension.json", "plugin.json"]
exclude = ["**/__pycache__", "**/*.pyc"]
