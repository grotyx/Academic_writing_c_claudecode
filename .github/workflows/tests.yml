name: tests

# Run the verification-harness pytest suite on every push to main and on PRs,
# so a change that breaks check_citations / check_numbers / check_gate /
# check_coverage / format_references (etc.) is caught before it lands.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt = requirements.txt + pytest.
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      # Track B: build and install the wheel (non-editable), then run the
      # installed-engine tests from outside the package.
      - name: Install paperflow wheel
        run: pip install .

      - name: Run installed-engine tests
        env:
          PAPERFLOW_INSTALLED: "1"
        run: python -m pytest -q tests/test_compat_contract.py
