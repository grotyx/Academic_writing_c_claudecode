name: release

# Tag a release automatically once the tests pass on main: when harness/__init__.py
# carries a version that has no vX.Y.Z tag yet, create the annotated tag and a GitHub
# Release with that version's CHANGELOG entry. `manuwright update` installs from the
# newest tag, so a merged version bump reaches users without a manual tagging step.

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:  # publish an existing tag to PyPI by hand
    inputs:
      tag:
        description: existing tag to publish to PyPI (for example v1.10.6)
        required: true

permissions:
  contents: write

jobs:
  tag:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Tag and release the version if it is new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(python3 -c "import re; print(re.search(r\"__version__ = '([^']+)'\", open('harness/__init__.py').read()).group(1))")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          # Only tag the newest version: a later commit on main may already carry a newer one.
          git fetch -q origin main
          head_version=$(git show origin/main:harness/__init__.py | python3 -c "import re,sys; print(re.search(r\"__version__ = '([^']+)'\", sys.stdin.read()).group(1))")
          if [ "$head_version" != "$version" ]; then
            echo "main has moved on to $head_version; skipping $tag."
            exit 0
          fi
          awk -v h="### $tag " 'index($0, h) == 1 {on=1; next} on && /^### v/ {exit} on {print}' CHANGELOG.md > notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "$SHA"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag
          echo "created=true" >> "$GITHUB_OUTPUT"

  # PyPI via trusted publishing (no token stored). Runs only after the repository variable
  # PYPI_PUBLISH is set to "true", which the owner does once the pending publisher exists on
  # pypi.org (project manuwright, workflow release.yml, environment pypi).
  pypi:
    needs: tag
    if: ${{ !cancelled() && vars.PYPI_PUBLISH == 'true' && (needs.tag.outputs.created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (Twine 7: metadata 2.5)
